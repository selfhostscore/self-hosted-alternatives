name: Refresh data & deploy

# Daily: pull fresh GitHub data -> rebuild -> commit README/awesome/dataset -> deploy to Cloudflare.
# The daily commit is also what keeps this schedule alive (GitHub silently disables cron workflows
# in public repos after 60 days without pushes); the last step re-enables it via the API as well.

on:
  schedule:
    - cron: "23 5 * * *" # 05:23 UTC daily (off the top-of-hour rush, when GitHub delays runs)
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # commit refreshed data
  actions: write # keepalive: re-enable the schedule if GitHub disabled it

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # native TypeScript (type stripping), zero deps

      - name: Enrich from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # built-in token, 1,000 req/h: enough for ~130 repos + releases
        run: node scripts/enrich.ts

      - name: Build site + README + dataset
        run: node scripts/build-site.ts

      - name: Commit refreshed data
        # Never fails the job: a rejected push (someone pushed while this run was building)
        # is retried after a rebase, and otherwise left for the next run. Deploy still happens.
        run: |
          git config user.name "selfhostscore-bot"
          git config user.email "team@selfhostscore.com"
          git add README.md awesome.md data/tools.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed data commit (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected (attempt $attempt): rebasing on origin/main."
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; break; }
          done
          echo "::warning::Data commit could not be pushed because of a concurrent push. The next run will commit it."
          exit 0

      - name: Deploy to Cloudflare (Worker static assets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret not set, skipping deploy (data was still committed)."
            exit 0
          fi
          npx -y wrangler@4 deploy

      - name: Keep the schedule alive
        # Re-enable this workflow via the API in case GitHub disabled the cron (60-day inactivity rule).
        # Inline on purpose: third-party keepalive actions have been blocked/disabled before.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/refresh.yml/enable" && echo "Schedule (re)enabled."
